  <style>
    :root{
      --accent:#163a63;
      --accent-2:#244f80;
      --accent-soft:#eef4fb;
      --text-main:#172033;
      --text-muted:#5f6b7a;
      --card-radius: 22px;
      --shadow-soft: 0 16px 40px rgba(18, 34, 56, 0.10);
      --shadow-featured: 0 20px 45px rgba(22, 58, 99, 0.16);
    }

    .section-intro{
      margin-bottom: 1.5rem;
    }

    .section-title{
      font-size: clamp(1.8rem, 2.8vw, 2.6rem);
      font-weight:800;
      color: var(--text-main);
      margin-bottom:.5rem;
    }

    .special-speakers-block{
      margin-bottom: 4rem;
      position: relative;
    }

    .special-speakers-frame{
      background: linear-gradient(180deg, #ffffff 0%, #f9fbfe 100%);
      border: 1px solid rgba(22, 58, 99, 0.08);
      border-radius: 28px;
      padding: 2rem;
      box-shadow: var(--shadow-soft);
    }

    .workshop-card{
      border-radius: var(--card-radius);
      overflow: hidden;
      background: #fff;
      transition: transform .28s ease, box-shadow .28s ease;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      height: 100%;
    }

    .workshop-card:hover{
      transform: translateY(-6px);
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.12);
    }

    .workshop-img{
      width: 100%;
      height: 290px;
      object-fit: cover;
      display: block;
      background: #edf2f7;
    }

    .speaker-badge{
      position:absolute;
      right:18px;
      bottom:-28px;
      z-index:3;
      width:62px;
      height:62px;
      border-radius:50%;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      background: #fff;
    }

    .speaker-badge img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .workshop-card .card-body{
      padding-top: 2.9rem !important;
    }

    .workshop-card .card-title{
      color: var(--text-main);
      line-height:1.35;
      min-height: 70px;
      font-size: 1rem;
    }

    .workshop-card .card-text{
      color: var(--text-muted);
      font-size: .95rem;
    }

    .workshop-card .btn{
      border-width: 1.5px;
      font-weight: 600;
      transition: all .25s ease;
    }

    .workshop-card .btn:hover{
      transform: translateY(-1px);
    }

    .workshop-card--featured{
      position: relative;
      border: 1px solid rgba(22, 58, 99, 0.12);
      box-shadow: var(--shadow-featured);
      background: linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
    }

    .workshop-card--featured::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--card-radius);
      padding:1px;
      background: linear-gradient(135deg, rgba(36,79,128,.35), rgba(22,58,99,.08));
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events:none;
    }

    .featured-ribbon{
      position:absolute;
      top:16px;
      left:16px;
      z-index:4;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color:#fff;
      padding:.5rem .95rem;
      border-radius:999px;
      font-size:.72rem;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      box-shadow: 0 10px 22px rgba(22, 58, 99, .28);
    }

    .workshop-card--featured .card-title{
      color: var(--accent);
      font-size: 1.08rem;
      min-height: 62px;
    }

    .workshop-card--featured .card-text{
      color:#334155;
      font-size: 1rem;
      font-weight: 500;
    }

    .workshop-card--featured .btn-outline-dark{
      border-color: var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .workshop-card--featured .btn-outline-dark:hover{
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .regular-section-title{
      margin-top: .5rem;
      margin-bottom: 1.8rem;
    }

    .regular-section-title h3{
      font-size: clamp(1.4rem, 2vw, 2rem);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom:.35rem;
    }

    .hero-strip {
      display: flex;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      overflow: hidden;
      min-height: 190px;
      height: 300px;
      background: #006080;
      position: relative;
      z-index: 2;
    }

    .hero-strip__media { 
      flex: 0 0 58%; 
      min-height: 190px; 
    }

    .hero-strip__media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-strip__panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.2rem 2.4rem;
      background: linear-gradient(
        90deg,
        rgba(0,0,0,0.90) 0%,
        rgba(0,96,128,0.92) 55%,
        rgba(0,96,128,0.92) 100%
      );
    }

    .hero-strip__title {
      margin: 0;
      color: #fff;
      font-weight: 800;
      font-size: clamp(1.4rem, 2.8vw, 2.8rem);
    }

    /* TABS */
    .date-tabs {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .date-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.9rem 2rem;
      border-radius: 14px;
      border: 2px solid rgba(0,96,128,0.2);
      background: #fff;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      color: #374151;
      min-width: 130px;
    }

    .date-tab:hover {
      border-color: #006080;
      color: #006080;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,96,128,0.12);
    }

    .date-tab.active {
      background: linear-gradient(135deg, #006080, #00b4d8);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 6px 24px rgba(0,96,128,0.3);
      transform: translateY(-3px);
    }

    .date-tab__day {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .date-tab__month {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
      margin-top: 0.2rem;
      text-align: center;
    }

    .date-tab--all .date-tab__day {
      font-size: 1.2rem;
      margin-bottom: .2rem;
    }

    /* MODAL */
    .speaker-modal__img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 18px;
      background: #edf2f7;
    }

    .speaker-modal__name {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: .35rem;
    }

    .speaker-modal__title {
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: .8rem;
    }

    .speaker-modal__meta {
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .speaker-schedule-card {
      border: 1px solid rgba(22,58,99,.08);
      border-radius: 16px;
      padding: 1rem;
      background: #f8fbff;
      margin-bottom: .9rem;
    }

    .speaker-schedule-card:last-child {
      margin-bottom: 0;
    }

    .speaker-schedule-card__day {
      display: inline-block;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--accent);
      background: #e9f3ff;
      border-radius: 999px;
      padding: .35rem .7rem;
      margin-bottom: .65rem;
    }

    .speaker-schedule-card__time {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: .3rem;
    }

    .speaker-schedule-card__topic {
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 0;
    }

    .hidden-by-filter {
      display: none !important;
    }

      align-items: center;
      justify-content: center;

      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      text-align: left;
      padding: 2.2rem 2.4rem;
      background: linear-gradient(

        rgba(0,0,0,0.90) 0%,
        rgba(0,96,128,0.92) 55%,
        rgba(0,96,128,0.92) 100%
      );
    }

    .hero-strip__title {
      margin: 0;
      color: #fff;
      font-weight: 800;
      font-size: clamp(1.4rem, 2.8vw, 2.8rem);
      text-align: left;
      width: 100%;
    }

    @media (max-width: 575.98px){
      .workshop-img{
        height: 260px;
      }

      .speaker-badge{

        height:56px;
        bottom:-24px;
      }

      .workshop-card .card-body{
        padding-top: 2.6rem !important;
      }
    }
  </style>
</head>

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getSchedulesForFilter(speaker) {
      if (currentFilter === 'all') return speaker.schedules;
      return speaker.schedules.filter(item => item.day === currentFilter);
    }

    function speakerMatchesFilter(speaker) {
      if (currentFilter === 'all') return true;
      return speaker.schedules.some(item => item.day === currentFilter);
    }

    function getCardTitle(speaker) {
    return speaker.mainTitle || 'Tema por confirmar';
  }

  function getCardSubtitle(speaker) {
    return speaker.name;
  }

    function createFeaturedCard(speaker, index) {
      return `
        <div class="col-12 col-md-6 col-lg-4 speaker-item">
          <div class="card workshop-card workshop-card--featured h-100 border-0">
            <div class="position-relative">
              <span class="featured-ribbon">Invitado especial</span>
              <img src="${escapeHtml(speaker.image || fallbackImg)}" class="card-img-top workshop-img" alt="${escapeHtml(speaker.name)}" onerror="this.src='${fallbackImg}'">
              <div class="speaker-badge">
                <img src="${escapeHtml(speaker.flag || fallbackFlag)}" alt="${escapeHtml(speaker.country || 'País')}" class="rounded-circle border border-3 border-white" onerror="this.src='${fallbackFlag}'">
              </div>
            </div>
            <div class="card-body p-4 d-flex flex-column">
              <h5 class="card-title fw-bold">${escapeHtml(getCardTitle(speaker))}</h5>
              <p class="card-text flex-grow-1 mb-0">${getCardSubtitle(speaker)}</p>
              <div class="d-flex justify-content-end mt-3">
                <button type="button" class="btn btn-outline-dark btn-sm rounded-pill px-4" onclick="openSpeakerModal(${index})">Leer más</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function createRegularCard(speaker, index) {
      return `
        <div class="col-12 col-md-6 col-lg-3 speaker-item">
          <div class="card workshop-card h-100 border-0 shadow-sm">
            <div class="position-relative">
              <img src="${escapeHtml(speaker.image || fallbackImg)}" class="card-img-top workshop-img" alt="${escapeHtml(speaker.name)}" onerror="this.src='${fallbackImg}'">
              <div class="speaker-badge">
                <img src="${escapeHtml(speaker.flag || fallbackFlag)}" alt="${escapeHtml(speaker.country || 'País')}" class="rounded-circle border border-3 border-white" onerror="this.src='${fallbackFlag}'">
              </div>
            </div>
            <div class="card-body p-4 d-flex flex-column">
              <h5 class="card-title fw-bold">${escapeHtml(getCardTitle(speaker))}</h5>
              <p class="card-text small flex-grow-1 mb-0">${getCardSubtitle(speaker)}</p>
              <div class="d-flex justify-content-end mt-3">
                <button type="button" class="btn btn-outline-dark btn-sm rounded-pill px-4" onclick="openSpeakerModal(${index})">Leer más</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSpeakers() {
      const featuredGrid = document.getElementById('featured-speakers-grid');
      const regularGrid = document.getElementById('regular-speakers-grid');

      const visibleFeatured = speakers.filter(s => s.featured && speakerMatchesFilter(s));
      const visibleRegular = speakers.filter(s => !s.featured && speakerMatchesFilter(s));

      featuredGrid.innerHTML = visibleFeatured.map((speaker, index) => {
        const realIndex = speakers.findIndex(item => item.name === speaker.name);
        return createFeaturedCard(speaker, realIndex);
      }).join('');

      regularGrid.innerHTML = visibleRegular.map((speaker) => {
        const realIndex = speakers.findIndex(item => item.name === speaker.name);
        return createRegularCard(speaker, realIndex);
      }).join('');

      document.getElementById('special-speakers-section').style.display = visibleFeatured.length ? '' : 'none';
    }

    function filterPonencias(day, btn) {
      currentFilter = day;

      document.querySelectorAll('.ponencias-tabs .date-tab').forEach(tab => {
        tab.classList.remove('active');
      });

      btn.classList.add('active');
      renderSpeakers();
    }

    function buildScheduleHtml(speaker) {
      const schedules = getSchedulesForFilter(speaker);

      return schedules.map(item => `
        <div class="speaker-schedule-card">
          <div class="speaker-schedule-card__day">${escapeHtml(item.dayLabel)}</div>
          <div class="speaker-schedule-card__time">Horario: ${escapeHtml(item.time)}</div>
          <p class="speaker-schedule-card__topic"><strong>Título:</strong> ${escapeHtml(item.title)}</p>
        </div>
      `).join('');
    }

    function openSpeakerModal(index) {
      const speaker = speakers[index];
      if (!speaker) return;

      const schedules = getSchedulesForFilter(speaker);
      const titleForModal = currentFilter !== 'all' && schedules.length === 1
        ? schedules[0].title
        : (speaker.mainTitle || 'Participaciones programadas');

      document.getElementById('modalSpeakerImage').src = speaker.image || fallbackImg;
      document.getElementById('modalSpeakerImage').onerror = function () {
        this.src = fallbackImg;
      };

      document.getElementById('modalSpeakerName').textContent = speaker.name;
      document.getElementById('modalSpeakerTitle').textContent = titleForModal;
      document.getElementById('modalSpeakerMeta').innerHTML = `
        <strong>País:</strong> ${escapeHtml(speaker.country || 'No especificado')}
      `;
      document.getElementById('modalSpeakerSchedule').innerHTML = buildScheduleHtml(speaker);

      speakerModal.show();
    }

    document.addEventListener('DOMContentLoaded', function () {
      speakerModal = new bootstrap.Modal(document.getElementById('speakerModal'));
      renderSpeakers();
    });
  </script>
